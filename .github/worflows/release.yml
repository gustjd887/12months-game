name: Release Go Binaries
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with: { go-version: '1.22' }
    - run: go mod download
    - name: Build
      run: |
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -trimpath -o myapp${{ matrix.ext }} ./cmd/myapp  # cmd/myapp는 실제 main 경로로 변경
        zip -r myapp-${{ matrix.os }}-${{ matrix.arch }}.zip myapp${{ matrix.ext }}  # 압축 (선택)
      shell: bash
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          myapp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          myapp-${{ matrix.os }}-${{ matrix.arch }}.zip  # 압축본
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
